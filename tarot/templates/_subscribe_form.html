<div class="capture">
  <div>
    <p class="eyebrow">The daily card</p>
    <h2 style="font-size:23px;line-height:1.2">One card each morning, with its colour and stone.</h2>
    <p style="color:var(--ink-2);font-size:15px;margin:10px 0 0;max-width:46ch">
      Free. One click to leave. We send the card and what to watch — not offers.
    </p>
  </div>
  <form method="post" action="{{ url_for('subscribe') }}" class="capture-form">
    <input type="hidden" name="source" value="{{ source }}">
    <label class="visually-hidden" for="sub-email-{{ source }}">Email address</label>
    <input type="email" id="sub-email-{{ source }}" name="email" required
           placeholder="you@example.com" autocomplete="email">
    <button class="btn" type="submit">Send it daily</button>
    <p class="consent">{{ consent_text }}
       <a href="{{ url_for('legal', page='privacy') }}">Privacy</a>.</p>
  </form>
</div>
