{% extends "base.html" %}
{% block body %}
<section class="card-page">
  <div class="narrow" style="max-width:520px">
    <p class="eyebrow">Operator</p>
    <h1 style="font-size:34px;line-height:1.1">Sign in</h1>
    {% if error %}<div class="note-block" style="border-color:var(--c-red);margin:20px 0"><p>{{ error }}</p></div>{% endif %}
    <form method="post" action="{{ url_for('admin') }}" class="ask" style="margin-top:24px">
      <label for="key">Admin key</label>
      <input type="password" id="key" name="key" autocomplete="off" required>
      <div class="ask-row" style="justify-content:flex-start">
        <button class="btn" type="submit">Open</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
